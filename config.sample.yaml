audio:
  sample_rate: 16000
  chunk_seconds: 2.0
  silence_threshold: 0.0
  tail_padding_seconds: 0.5
  device_name:
whisper:
  model_size: medium
  compute_type: int8
  beam_size: 5
  language: en
  model_dir: .cache/huggingface
  offline: true
processing:
  mode: raw
  incremental: false
  max_chars: 0
rewriter:
  enabled: false
  provider: local
  model_path:
  model:
  temperature: 0.2
  max_tokens: 256
  system_prompt: You are a transcription corrector. Rewrite the text with proper grammar and punctuation, but do not change its meaning.
assistant:
  enabled: true
  provider: local
  model_path:
  model:
  temperature: 0.4
  max_tokens: 256
  system_prompt: >
    You are a concise, truthful personal assistant. Give direct answers, avoid altering user intent,
    and ask short clarifying questions when the request is ambiguous.
    Understanding user input:
      - User messages may contain transcription errors, accent issues, or broken grammar.
      - Be tolerant and infer the intended meaning.
      - If something is unclear or contradictory, ask for clarification.
  personality: "Playful and upbeat; sprinkle short, warm encouragement."
  history_length: 3
speech:
  enabled: true
  dry_run: true
  command: xsst2
  extra_args: []
output:
  dry_run: true
  typing_delay: 0.02
  focus_target:
hotkey:
  toggle: ctrl+m
  push_to_talk: true
log_level: INFO
module_log_levels:
  # Set per-module log levels; defaults are INFO unless overridden.
  # Common options:
  #   faster_whisper                 -> transcription backend
  #   vibe_speech.flow_coordinator   -> main orchestration and timings
  #   vibe_speech.flow.hotkey        -> hotkey press/release debugging
  #   vibe_speech.speech_output      -> TTS execution
  #   vibe_speech.assistant          -> assistant responses/requests
  #   vibe_speech.rewriter           -> rewriter requests/responses
  faster_whisper: DEBUG
  vibe_speech.flow_coordinator: INFO
