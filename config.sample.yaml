audio:
  sample_rate: 16000
  chunk_seconds: 2.0
  silence_threshold: 0.0
  device_name:
whisper:
  model_size: medium
  compute_type: int8
  beam_size: 5
  language: en
  model_dir: .cache/huggingface
  offline: true
processing:
  mode: raw
  incremental: false
  max_chars: 0
rewriter:
  enabled: false
  provider: local
  model_path:
  model:
  temperature: 0.2
  max_tokens: 256
  system_prompt: You are a transcription corrector. Rewrite the text with proper grammar and punctuation, but do not change its meaning.
output:
  dry_run: true
  typing_delay: 0.02
  focus_target:
hotkey:
  toggle: ctrl+shift+space
  push_to_talk: true
log_level: INFO
