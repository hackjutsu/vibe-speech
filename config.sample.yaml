audio:
  sample_rate: 16000
  chunk_seconds: 2.0
  silence_threshold: 0.0
  tail_padding_seconds: 0.5
  device_name:
whisper:
  model_size: medium
  compute_type: int8
  beam_size: 5
  language: en
  model_dir: .cache/huggingface
  offline: true
processing:
  mode: raw
  incremental: false
  max_chars: 0
rewriter:
  enabled: false
  provider: local
  model_path:
  model:
  temperature: 0.2
  max_tokens: 256
  system_prompt: You are a transcription corrector. Rewrite the text with proper grammar and punctuation, but do not change its meaning.
assistant:
  enabled: true
  provider: local
  model_path:
  model:
  temperature: 0.4
  max_tokens: 256
  system_prompt: You are a concise, thoughtful personal assistant. Stay helpful, avoid rewriting inputs, and speak in the configured personality.
  personality: Friendly and concise, with a calm tone.
speech:
  enabled: true
  dry_run: true
  command: xsst2
  extra_args: []
output:
  dry_run: true
  typing_delay: 0.02
  focus_target:
hotkey:
  toggle: ctrl+shift+space
  push_to_talk: true
log_level: INFO
