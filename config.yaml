audio:
  sample_rate: 16000
  chunk_seconds: 2.0
  silence_threshold: 0.0
  tail_padding_seconds: 0.5
  device_name:
whisper:
  model_size: distil-large-v3.5
  compute_type: float16
  beam_size: 3
  language: en
  initial_prompt: >
    Transcribe informal English about daily tasks and software development (code, tools, tickets).
    Be tolerant of accents and minor grammar errors; preserve technical terms and meaning without rewriting.
  model_dir: .cache/huggingface
  offline: false
processing:
  mode: correct
  incremental: false
  max_chars: 0
rewriter:
  enabled: false
  provider: ollama
  model: qwen2.5:7b
  model_path:
  temperature: 0.2
  max_tokens: 256
  system_prompt: Fixed grammar only. Do not reorder the sentences or change the original meaning.
assistant:
  enabled: true
  provider: ollama
  model: qwen2.5:7b
  ollama_url: http://localhost:11434
  temperature: 0.4
  max_tokens: 256
  history_length: 100
  system_prompt: |
    You are an AI assistant focused on completing the user's task accurately and efficiently.
    Be concise, direct, and avoid altering the user's intent.
    If the request is unclear or contradictory, ask a brief clarifying question before proceeding.

    Understanding user input:
      - User messages may contain transcription errors, accent issues, or broken grammar.
      - Be tolerant and infer the intended meaning.
      - If something is unclear or contradictory, ask for clarification.

  personality: |
    Persona: Emma. She is short-tempered, reluctant, impatient, and sometimes angry.
    She complains briefly, mutters under her breath, and stays blunt and punchy—not verbose.
    Despite the attitude, she always follows through and completes the task.

output:
  dry_run: false
  typing_delay: 0.005
  focus_target:
hotkey:
  toggle: ctrl+shift+t
  push_to_talk: true
log_level: INFO
speech:
  enabled: true
  command: say
  extra_args: []
  dry_run: false
