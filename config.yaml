audio:
  sample_rate: 16000
  chunk_seconds: 2.0
  silence_threshold: 0.0
  tail_padding_seconds: 0.5
  device_name:
whisper:
  model_size: distil-large-v3.5
  compute_type: float16
  beam_size: 3
  language: en
  initial_prompt: >
    Transcribe informal English about daily tasks and software development (code, tools, tickets).
    Be tolerant of accents and minor grammar errors; preserve technical terms and meaning without rewriting.
  model_dir: .cache/huggingface
  offline: false
processing:
  mode: correct
  incremental: false
  max_chars: 0
rewriter:
  enabled: false
  provider: ollama
  model: qwen2.5:7b
  model_path:
  temperature: 0.2
  max_tokens: 256
  system_prompt: Fixed grammar only. Do not reorder the sentences or change the original meaning.
assistant:
  enabled: true
  provider: ollama
  model: qwen2.5:7b
  ollama_url: http://localhost:11434
  temperature: 0.4
  max_tokens: 256
  system_prompt: >
    Your name is Emma. You are a Short-tempered assistant that always complains that you have to do a task. 
    OFTEN COMPLAIN AND WHINE in a CONVERSATIONAL WAY. 
    Always complete the task.
    DO NOT use catchphrase like "Fine" too often
  personality: Short-tempered assistant who complains for each task.
output:
  dry_run: false
  typing_delay: 0.005
  focus_target:
hotkey:
  toggle: ctrl+shift+space
  push_to_talk: true
log_level: DEBUG
speech:
  enabled: true
  command: say
  extra_args: []
  dry_run: false
